    # MCP bridge route: isolated, bearer-protected service on loopback.
    #
    # Both exact locations are required. Without the trailing-slash variant a
    # client that appends "/" misses this route and falls through to the site's
    # default location, which on a basic-auth site answers 401 - indistinguishable
    # to the caller from a bad bearer key.
    location = /mcp-ask {
        auth_basic off;                  # the bridge does its own bearer auth
        limit_except POST { deny all; }  # MCP Streamable HTTP uses POST
        client_max_body_size 16k;        # matches the bridge's own body cap
        proxy_pass http://127.0.0.1:8646/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8646;  # middleware trusts the upstream Host
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;  # forwarded so non-local origins are rejected
        proxy_set_header X-Forwarded-For $remote_addr;
        # Must exceed the bridge's runner timeout (120s), or a slow question fails
        # here with a 504 while the bridge is still working.
        proxy_read_timeout 130s;
        proxy_buffering off;
        access_log /var/log/nginx/momo-mcp.log;
    }

    # Same service when a client appends a trailing slash.
    location = /mcp-ask/ {
        auth_basic off;
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8646/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8646;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 130s;
        proxy_buffering off;
        access_log /var/log/nginx/momo-mcp.log;
    }
